<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 - Pagina non trovata | MyFrEM - Piattaforma ufficiale di Friuli Emergenze</title>

  <meta
    name="description"
    content="La pagina che stai cercando non esiste oppure è stata spostata."
  />

  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0f14" />

  <link
    rel="shortcut icon"
    href="https://www.friuliemergenze.it/assets/logo.png"
    type="image/x-icon"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="/app.css" />

  <style>
    body.app {
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(800px 420px at 50% -10%, rgba(31, 200, 219, 0.12), transparent 60%),
        var(--bg);
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 40px 32px;
      border-radius: var(--radius-xl);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin-bottom: 20px;
      border-radius: 14px;
    }

    .code {
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .container p {
      margin: 0 0 10px;
      color: var(--text-2);
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 26px;
    }

    .app .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-weight: 700;
      text-decoration: none;
      transition: background var(--t-fast);
    }

    .app .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
    }

    .app .btn-primary:hover {
      background: var(--accent-strong);
    }

    .app .btn-secondary {
      border: 1px solid var(--line-strong);
      color: var(--text);
    }

    .app .btn-secondary:hover {
      background: var(--surface-hover);
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--text-3);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .app .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .container {
        padding: 32px 20px;
      }

      .code {
        font-size: 3.6rem;
      }

      .actions {
        flex-direction: column;
      }

      .app .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body class="app">

  <main class="container">

    <img
      src="/assets/icons/logo.png"
      alt="Logo Friuli Emergenze"
      class="logo"
    />

    <div class="code">
      404
    </div>

    <h1>
      Pagina non trovata
    </h1>

    <p>
      La pagina che stai cercando potrebbe essere stata rimossa,
      rinominata oppure non essere temporaneamente disponibile.
    </p>

    <p>
      Puoi tornare alla home oppure accedere direttamente
      alla piattaforma MyFrEM.
    </p>

    <div class="actions">

      <a
        href="/"
        class="btn btn-primary"
        aria-label="Torna alla home"
      >
        Torna alla home
      </a>

      <a
        href="/login/signin"
        class="btn btn-secondary"
        aria-label="Accedi a MyFrEM"
      >
        Accedi
      </a>

    </div>

    <div class="footer">

      © 2026 Friuli Emergenze

      <br><br>

      <a
        href="https://friuliemergenze.it"
        target="_blank"
        rel="noopener noreferrer"
      >
        Sito ufficiale
      </a>

    </div>

  </main>

</body>
</html>
