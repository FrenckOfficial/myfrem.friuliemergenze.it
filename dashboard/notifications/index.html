<body class="app">
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/dashboard/">
          <img src="/assets/icons/logo.png" alt="">
          <span>MyFrEM<small>Area personale</small></span>
        </a>
        <nav class="app-nav" data-area="user" aria-label="Menu principale"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>
    <div class="main-content app-main">
      <div class="app-container">
    
      <header class="notifications-header">
        <div>
          <h1>Notifiche</h1>
          <p class="page-sub">Aggiornamenti sulle tue foto, sulle associazioni e dalla piattaforma.</p>
        </div>
        <button id="markAllReadBtn" class="btn-mark-all">Segna tutto come letto</button>
      </header>

      <div class="notifications-controls">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">Tutte</button>
          <button class="filter-tab" data-filter="unread">Non lette</button>
          <button class="filter-tab" data-filter="activity">Attività</button>
          <button class="filter-tab" data-filter="system">Sistema</button>
        </div>
      </div>

      <div class="notifications-list" id="notificationsList">
        <!-- Caricato dinamicamente -->
      </div>

      <div class="pagination" id="pagination">
        <!-- Caricato dinamicamente -->
      </div>
      </div>
    </div>
    </div>
  </div>
