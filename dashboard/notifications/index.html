<!DOCTYPE html>
<html lang="it">
<head>

  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifiche | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/dashboard/dsh.css">
  <link rel="shortcut icon" href="/assets/icons/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script>
    
  </script>
  
</head>
<body>
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <aside class="sidebar">
        <div class="logo">
          <img src="/assets/icons/logo.png" alt="MyFrEM Logo" loading="lazy">
          <h2>MyFrEM</h2>
        </div>
        <nav class="navbar">
          <a href="/dashboard">Home</a>
          <a href="/dashboard/upload">Carica una foto</a>
          <a href="/dashboard/my-content">I miei contenuti</a>
          <a href="/dashboard/myfrem-photos">Tutte le foto</a>
          <a href="/dashboard/settings/">Impostazioni</a>
        </nav>
        <button id="logoutBtn" class="logout">Logout</button>
    </aside>
    <div class="main-content">
    
      <header class="notifications-header">
        <h1>Notifiche</h1>
        <button id="markAllReadBtn" class="btn-mark-all">Segna tutto come letto</button>
      </header>

      <div class="notifications-controls">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">Tutte</button>
          <button class="filter-tab" data-filter="unread">Non lette</button>
          <button class="filter-tab" data-filter="activity">Attività</button>
          <button class="filter-tab" data-filter="system">Sistema</button>
        </div>
      </div>

      <div class="notifications-list" id="notificationsList">
        <!-- Caricato dinamicamente -->
      </div>

      <div class="pagination" id="pagination">
        <!-- Caricato dinamicamente -->
      </div>
    </div>
  </div>

  <script type="module" src="/dashboard/notifications/load.js"></script>
  <link rel="stylesheet" href="/bottomNav.css">
  <script src="/bottomNav.js"></script>
