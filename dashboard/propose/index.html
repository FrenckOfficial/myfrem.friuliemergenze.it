<body>

  <div class="content" style="display:none;">

    <aside class="sidebar">

    <main class="main-content">

        <form id="eventForm" class="event-form">

            <label for="eventTitle">Titolo Evento *</label>
            <input type="text" id="eventTitle" required>
          </div>
          <div class="form-group">
            <label for="description">Descrizione dettagliata *</label>
            <textarea id="description" required></textarea>
          </div>
          <div class="form-group">
            <label for="location">Luogo di incontro suggerito *</label>
            <input type="text" id="location" required>
          </div>
          <div class="form-group">
            <label for="contact">Contatto (o nome utente WhatsApp) *</label>
            <input type="text" id="contact" required>
          </div>

          <button type="submit" class="btn-primary">Invia proposta evento</button>
        </form>
    </main>
  </div>
  <script type="module" src="/dashboard/ntf.js"></script>
  <script src="/scripts/shinystat.js?USER=SS-55951055-66dfb" style="display:none;"></script>
  <noscript>
    <a href="https://www.shinystat.com/it/" target="_top">
    <img src="//www.shinystat.com/cgi-bin/shinystat.cgi?USER=SS-55951055-66dfb" alt="Statistiche web" style="border:0px" /></a>
  </noscript>
  
  <script>
    (function() {
      const menuToggle = document.querySelector('.menu-toggle');
      const sidebar = document.querySelector('.sidebar');
      const body = document.body;

      if (!menuToggle || !sidebar) {
        console.warn('Menu toggle or sidebar not found');
        return;
      }
      
      function toggleSidebar() {
        sidebar.classList.toggle('active');
        body.classList.toggle('sidebar-open');
      }

      function closeSidebar() {
        sidebar.classList.remove('active');
        body.classList.remove('sidebar-open');
      }
      function openSidebar() {
        sidebar.classList.add('active');
        body.classList.add('sidebar-open');
      }

      menuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSidebar();
      });

      const navLinks = sidebar.querySelectorAll('nav a');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          closeSidebar();
        });
      });

      document.addEventListener('click', (e) => {
        if (sidebar.classList.contains('active')) {
          if (e.target === menuToggle || menuToggle.contains(e.target)) {
            return;
          }
          if (!sidebar.contains(e.target)) {
            closeSidebar();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('active')) {
          closeSidebar();
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (window.innerWidth > 768) {
            closeSidebar();
          }
        }, 250);
      });
    })();
  </script>
  <div class="notification-bell-floating">
    <button class="bell-button" id="bellButton" aria-label="Notifiche">
      <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
