<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carica una Foto | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/dashboard/dsh.css">
  <link rel="shortcut icon" href="/assets/icons/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <aside class="sidebar">
      <div class="logo">
        <img src="/assets/icons/logo.png" alt="MyFrEM Logo" loading="lazy">
        <h2>MyFrEM</h2>
      </div>
      <nav class="navbar">
        <a href="/dashboard">Home</a>
        <a href="/dashboard/upload" class="active">Carica una foto</a>
        <a href="/dashboard/my-content">I miei contenuti</a>
        <a href="/dashboard/myfrem-photos">Tutte le foto</a>
        <a href="/dashboard/settings/">Impostazioni</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>
  
    <div class="main-content">
        <h1>Carica una Foto</h1>
        <div class="statusBox" style="display:none;">
        </div>
        <form id="uploadForm">
          <div class="form-group" style="display:flex;flex-direction:row;gap:20px;">
            <div class="mini-group">
              <label>Modello del veicolo <b>*</b></label>
              <input type="text" id="title" required>
            </div>
  
            <div class="mini-group">
              <label>Targa</label>
              <input type="text" id="licensePlate">
            </div>
          </div>
  
          <div class="form-group" style="display:flex;flex-direction:row;gap:20px;">
            <div class="mini-group">
              <label>Allestitore</label>
              <input type="text" id="sponsor">
            </div>
            
            <div class="mini-group">
              <label>Sede di appartenenza <b>*</b></label>
              <input type="text" id="location" required>
            </div>
          </div>
          
  
          <label>Tipologia di servizio svolto <b>*</b></label>
          <select id="serviceType" required style="margin-top:0;">
            <option value="none">Seleziona una tipologia</option>
            <option value="emergenza-sanitaria">Soccorso Sanitario</option>
            <option value="pompieri">Vigili del Fuoco</option>
            <option value="polizia-locale">Polizia Locale / Municipale</option>
            <option value="polizia-di-stato">Polizia di Stato</option>
            <option value="carabinieri">Carabinieri</option>
            <option value="guardia-di-finanza">Guardia di Finanza</option>
            <option value="guardia-costiera">Guardia Costiera</option>
            <option value="protezione-civile">Protezione Civile</option>
            <option value="soccorso-alpino">Soccorso Alpino e Speleologico</option>
            <option value="corpo-forestale-regionale">Corpo Forestale Regionale</option>
            <option value="ausiliari">Soccorso Stradale / Autostradale</option>
            <option value="altro">Altro (specificare nel campo note)</option>
          </select>
  
          <label style="margin-top:20px;">Note aggiuntive</label>
          <input type="text" id="notes" style="margin-top:0;">
  
          <div class="form-group" style="display:flex;flex-direction:row;gap:20px;">
            <input type="file" id="inp-upl" multiple accept="image/*">
            <label for="inp-upl">Scegli foto</label>
            <span id="file-name">Nessun file</span>
          </div>
  
          <progress id="progressBar" value="0" max="100" style="width:100%;display:none;"></progress>
          <p id="progressText" style="display:none;"></p>
  
          <button id="btn-upl">Carica</button>
          <p id="disclaimer">Tutti i campi evidenziati con * sono richiesti</p>

          <div id="previewContainer" class="preview-container">
            <div class="preview-wrapper">
              <img id="preview" class="preview-image" alt="Anteprima foto" />
              <button type="button" id="deletePreviewBtn" class="delete-preview-btn" title="Elimina preview">
                <i class="fa-solid fa-trash-can" style="color: rgb(255, 255, 255);"></i>
              </button>
            </div>
          </div>
        </form>
    </div>
  </div>

  <script defer type="module" src="/dashboard/upload/upload.js"></script>
  <script defer type="module" src="/dashboard/ntf.js"></script>
  <link rel="stylesheet" href="/bottomNav.css">
  <script src="/bottomNav.js"></script>
  <script src="/scripts/shinystat.js?USER=SS-55951055-66dfb" style="display:none;"></script>
  <noscript>
    <a href="https://www.shinystat.com/it/" target="_top">
    <img src="//www.shinystat.com/cgi-bin/shinystat.cgi?USER=SS-55951055-66dfb" alt="Statistiche web" style="border:0px" /></a>
  </noscript>
  
  
  <div class="notification-bell-floating">
    <button class="bell-button" id="bellButton" aria-label="Notifiche">
      <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="unread-badge" id="unreadBadge" style="display: none;">0</span>
    </button>

    <div class="notification-dropdown" id="notificationDropdown" style="display: none;">
      <div class="dropdown-header">
        <h3>Notifiche</h3>
        <button class="close-btn" id="closeDropdownBtn">✕</button>
      </div>

      <div class="notification-list" id="notificationList">
        <!-- Caricato dinamicamente -->
      </div>

      <div class="dropdown-footer">
        <a href="/dashboard/notifications" class="view-all-link">
          Vedi tutte →
        </a>
      </div>
    </div>
  </div>
</body>
</html>
