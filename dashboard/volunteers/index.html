<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area volontari | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/dashboard/dsh.css">
  <link rel="stylesheet" href="/helpers/feed.css">
  <link rel="shortcut icon" href="/assets/icons/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script defer type="module" src="/dashboard/volunteers/volunteers.js"></script>
</head>
<body>
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <aside class="sidebar">
      <div class="logo">
        <img src="/assets/icons/logo.png" alt="MyFrEM Logo" loading="lazy">
        <h2>MyFrEM</h2>
      </div>
      <nav class="navbar">
        <a href="/dashboard">Home</a>
        <a href="/dashboard/upload">Carica una foto</a>
        <a href="/dashboard/my-content">I miei contenuti</a>
        <a href="/dashboard/myfrem-photos">Tutte le foto</a>
        <a href="/dashboard/volunteers/" class="active">Area volontari</a>
        <a href="/dashboard/settings/">Impostazioni</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>
 
    <main class="main-content">
      <header class="header">
        <h1>Area volontari</h1>
        <p>Lo spazio riservato ai volontari delle associazioni su MyFrEM.</p>
      </header>
 
      <section id="feedSection" style="margin-top:22px" hidden>
        <div id="assocTabs" class="assoc-tabs"></div>
        <div id="manageLinks" class="manage-links" hidden></div>
        <div id="feedRoot"></div>
      </section>
 
      <section class="wip-box" id="pendingBox" hidden>
        <h2 id="wipTitle">Area in costruzione</h2>
        <p id="wipText"></p>
        <ul id="assocList" class="assoc-list">
          <!-- JS Loading -->
        </ul>
        <a class="link-more" href="/associations/">Vedi tutte le associazioni</a>
      </section>
    </main>
  </div>
 
  <link rel="stylesheet" href="/bottomNav.css">
  <script src="/bottomNav.js"></script>
  <script defer type="module" src="/dashboard/ntf.js"></script>
  <div class="notification-bell-floating">
    <button class="bell-button" id="bellButton" aria-label="Notifiche">
      <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="unread-badge" id="unreadBadge" style="display: none;">0</span>
    </button>
 
    <div class="notification-dropdown" id="notificationDropdown" style="display: none;">
      <div class="dropdown-header">
        <h3>Notifiche</h3>
        <button class="close-btn" id="closeDropdownBtn">✕</button>
      </div>
 
      <div class="notification-list" id="notificationList">
        <!-- Caricato dinamicamente -->
      </div>
 
      <div class="dropdown-footer">
        <a href="/dashboard/notifications" class="view-all-link">
          Vedi tutte →
        </a>
      </div>
    </div>
  </div>
</body>
</html>
