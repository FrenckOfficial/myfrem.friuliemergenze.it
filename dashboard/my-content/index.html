<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I miei contenuti | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/dashboard/dsh.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="shortcut icon" href="/assets/icons/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script>
    
  </script>
  <script defer type="module" src="/helpers/loadNavbar.js"></script>
  
</head>
<body class="app">
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>

  <div class="content" style="display:none;">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/dashboard/">
          <img src="/assets/icons/logo.png" alt="">
          <span>MyFrEM<small>Area personale</small></span>
        </a>
        <nav class="app-nav" data-area="user" aria-label="Menu principale"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>

    <main class="main-content app-main">
      <div class="app-container">
        <header class="page-head">
          <div>
            <h1>I miei contenuti</h1>
            <p>Le foto che hai caricato e a che punto è la loro revisione.</p>
          </div>
          <a class="btn btn--primary" href="/dashboard/upload"><i class="fa-solid fa-plus" aria-hidden="true"></i>Carica una foto</a>
        </header>

        <div class="notice" id="readOnlyNotice" hidden>
          <i class="fa-solid fa-eye" aria-hidden="true"></i>
          <span>Modalità sola lettura: puoi solo visualizzare i contenuti.</span>
        </div>

        <section class="panel">
          <div class="toolbar">
            <div class="tabs" role="tablist" id="statusTabs">
              <button class="tab active" type="button" role="tab" data-status="all">Tutte <span class="count" data-count="all">0</span></button>
              <button class="tab" type="button" role="tab" data-status="pending">In attesa <span class="count" data-count="pending">0</span></button>
              <button class="tab" type="button" role="tab" data-status="approved">Approvate <span class="count" data-count="approved">0</span></button>
              <button class="tab" type="button" role="tab" data-status="rejected">Rifiutate <span class="count" data-count="rejected">0</span></button>
            </div>
            <label class="search">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input type="search" id="searchInput" placeholder="Cerca per modello, targa, sede" aria-label="Cerca tra le tue foto">
            </label>
          </div>
          <div class="panel__body">
            <div id="photosContainer" class="pgrid"></div>
          </div>
        </section>
      </div>
    </main>
    </div>
  </div>

  <script defer type="module" src="/dashboard/my-content/load.js"></script>
  <script defer type="module" src="/dashboard/ntf.js"></script>
  <link rel="stylesheet" href="/bottomNav.css">
  
  
  
  <div class="notification-bell-floating">
    <button class="bell-button" id="bellButton" aria-label="Notifiche">
      <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="unread-badge" id="unreadBadge" style="display: none;">0</span>
    </button>

    <div class="notification-dropdown" id="notificationDropdown" style="display: none;">
      <div class="dropdown-header">
        <h3>Notifiche</h3>
        <button class="close-btn" id="closeDropdownBtn">✕</button>
      </div>

      <div class="notification-list" id="notificationList">
        <!-- Caricato dinamicamente -->
      </div>

      <div class="dropdown-footer">
        <a href="/dashboard/notifications" class="view-all-link">
          Vedi tutte →
        </a>
      </div>
    </div>
  </div>
</body>
</html>
