<body>
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>

  <div class="content" style="display:none;">
    <aside class="sidebar">
      <div class="logo">
        <img src="/assets/icons/logo.png" alt="MyFrEM Logo" loading="lazy">
        <h2>MyFrEM</h2>
      </div>
      <nav class="navbar">
        <a href="/dashboard">Home</a>
        <a href="/dashboard/upload">Carica una foto</a>
        <a href="/dashboard/my-content" class="active">I miei contenuti</a>

        <a href="/dashboard/settings/">Impostazioni</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="main-content">
      <div class="content-box" style="max-width:none;">
        <h1>I miei contenuti</h1>
        <p>Qui trovi tutte le foto e gli eventi creati da te.</p>

        <div class="tab-buttons">
          <button class="tab-btn active" data-tab="photos-tab">Le mie foto</button>
        </div>

        
          
          
        </p>

        <div class="tab-content active" id="photos-tab">
          <div id="photosContainer" class="photos-grid">
            <!-- JS inserirà le foto -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/dashboard/my-content/load.js"></script>
  <script type="module" src="/dashboard/ntf.js"></script>

    <button class="bell-button" id="bellButton" aria-label="Notifiche">

      <div class="dropdown-header">
        <h3>Notifiche</h3>
        <button class="close-btn" id="closeDropdownBtn">✕</button>
      </div>

      <div class="notification-list" id="notificationList">
        <!-- Caricato dinamicamente -->
      </div>

      <div class="dropdown-footer">
        <a href="/dashboard/notifications" class="view-all-link">
