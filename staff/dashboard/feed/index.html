<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderazione feed | Dashboard Staff - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/staff/dashboard/staff.css">
  <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="module" src="/staff/dashboard/feed/feed.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script defer type="module" src="/helpers/loadNavbar.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="stylesheet" href="/staff/dashboard/theme.css">
</head>
<body class="app app--staff">
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/staff/dashboard/">
          <img src="https://www.friuliemergenze.it/assets/logo.png" alt="">
          <span>MyFrEM<small>Area staff</small></span>
        </a>
        <nav class="app-nav" data-area="staff" aria-label="Menu staff"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>
    <main class="main-content app-main">
      <div class="app-container">
        <header class="page-head">
          <div>
            <h1>Moderazione feed</h1>
            <p>I post della community vengono pubblicati subito. Qui controlli quelli segnalati: dopo 3 segnalazioni un post viene nascosto in automatico finché non decidi.</p>
          </div>
        </header>

        <div class="notice" id="roleNotice" hidden>
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <span>La moderazione del feed è riservata allo staff da modstaff in su.</span>
        </div>

        <section class="panel" id="modPanel" hidden>
          <div class="toolbar">
            <div class="tabs" role="tablist" id="modTabs">
              <button class="tab active" type="button" role="tab" data-tab="reported">Segnalati <span class="count" data-count="reported">0</span></button>
              <button class="tab" type="button" role="tab" data-tab="hidden">Nascosti <span class="count" data-count="hidden">0</span></button>
              <button class="tab" type="button" role="tab" data-tab="recent">Ultimi post</button>
            </div>
          </div>
          <div class="mod-list" id="modList"></div>
          <div class="empty" id="modEmpty" hidden><i class="fa-regular fa-circle-check" aria-hidden="true"></i><span id="modEmptyText"></span></div>
        </section>
      </div>
    </main>
    </div>
  </div>
  <link rel="stylesheet" href="/bottomNav.css">
</body>
</html>
