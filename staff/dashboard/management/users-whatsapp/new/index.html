<html lang="it">
<head>

  <meta charset="UTF-8">

</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="https://www.friuliemergenze.it/assets/logo.png" alt="Logo MyFrEM" loading="lazy">
      <h2>MyFrEM Staff</h2>
    </div>
    <nav>
      <a href="/staff/dashboard/">Dashboard</a>
      <a href="/staff/dashboard/photos/">Moderazione foto</a>
      <a href="/staff/dashboard/users/" class="active">Funzionalità</a>
      <a href="/staff/dashboard/kick-reports/">Rapporti di espulsione</a>
      <a href="/staff/dashboard/settings/">Impostazioni</a>
        <br>
        <a href="/dashboard/">Passa a dashboard utente</a>
    </nav>
    <button id="logoutBtn" class="logout">Logout</button>
  </aside>
  <main class="main-content">
    <div class="top-bar">
        <h1>Nuovo Utente WhatsApp</h1>
    </div>

    <p>Compila il modulo qui sotto per aggiungere un nuovo utente WhatsApp.</p>
    
      
      
    </p>
    <div class="activity-box">
        <form id="expulsionReportForm">
            <div class="form-row">
              <div class="form-col">
                <label for="userSelect">Nome utente:</label>
                <textarea id="userSelect" class="photo-link-input"></textarea>
              </div>

              <div class="form-col">
                <label for="userNumber">Numero contatto utente:</label>
                <input type="tel" id="userNumber" class="photo-link-input">
              </div>
            </div>
            <div class="form-group">
                <label for="expulsionDate">Data entrata:</label>
                <input type="date" id="expulsionDate" class="photo-link-input" required>
            </div>
            <div class="form-group">
                <label for="notes">Note aggiuntive (facoltativo):</label>
                <textarea id="notes" class="photo-link-input" placeholder="Eventuali note aggiuntive..."></textarea>
            </div>
            <div class="form-group">
              <h3>Tag utente</h3>
              <div id="tagsContainer">
                <label><input type="checkbox" class="tagCheck" value="Amministratore"> #Amministratore</label><br>
                <label><input type="checkbox" class="tagCheck" value="Nuovo Utente"> #Nuovo Utente</label><br>
                <label><input type="checkbox" class="tagCheck" value="Membro"> #Membro</label><br>
                <label><input type="checkbox" class="tagCheck" value="Membro OG"> #Membro OG (prima del 10/2025)</label><br>
                <label><input type="checkbox" class="tagCheck" value="Staff"> #Staff</label><br>
              </div>
            </div>

            <div class="form-group">
              <h3>Collegamento a utente MyFrEM</h3>
              <input id="myfremIdInput" type="text" class="photo-link-input" placeholder="ID utente MyFrEM">
              <button type="button" id="linkMyFremBtn" class="quick-btn">Collega</button>

              <div id="myfremResult" style="margin-top:10px;font-size:14px;display:none;"></div>
            </div>
            <div class="form-group">
                <button type="submit" class="quick-btn">Aggiungi Utente</button>
            </div>
        </form>
        <div id="statusMsg"></div>
    </div>
  </main>
  <link rel="stylesheet" href="/bottomNav.css">
  <script src="/bottomNav.js"></script>
  <script>
    (function() {
      const menuToggle = document.querySelector('.menu-toggle');
      const sidebar = document.querySelector('.sidebar');
      const body = document.body;

      if (!menuToggle || !sidebar) {
        console.warn('Menu toggle or sidebar not found');
        return;
      }
      
      function toggleSidebar() {
        sidebar.classList.toggle('active');
        body.classList.toggle('sidebar-open');
      }

      function closeSidebar() {
        sidebar.classList.remove('active');
        body.classList.remove('sidebar-open');
      }
      function openSidebar() {
        sidebar.classList.add('active');
        body.classList.add('sidebar-open');
      }

      menuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSidebar();
      });

      const navLinks = sidebar.querySelectorAll('nav a');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          closeSidebar();
        });
      });

      document.addEventListener('click', (e) => {
        if (sidebar.classList.contains('active')) {
          if (e.target === menuToggle || menuToggle.contains(e.target)) {
            return;
          }
          if (!sidebar.contains(e.target)) {
            closeSidebar();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('active')) {
          closeSidebar();
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (window.innerWidth > 768) {
            closeSidebar();
          }
        }, 250);
      });
    })();
  </script>
</body>
</html>
