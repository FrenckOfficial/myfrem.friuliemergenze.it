<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->

    gtag('config', 'G-Z4DJJRR7BY');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Utenti Newsletter | Dashboard Staff - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/staff/dashboard/management/users-whatsapp/style.css">
  <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="module" src="/staff/dashboard/management/newsletter/users/load.js"></script>
  <style>
    .sidebar {
      height: 97%;
      width: 225px
    }

    @media (max-width: 768px) {
      .sidebar {
        position: relative;
        width: 94.5%;
        height: auto;
        padding: 15px 15px 10px;
        display: flex;
        flex-direction: column;
      }
      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script defer type="module" src="/helpers/loadNavbar.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="stylesheet" href="/staff/dashboard/theme.css">
</head>
<body class="app app--staff">
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/staff/dashboard/">
          <img src="https://www.friuliemergenze.it/assets/logo.png" alt="">
          <span>MyFrEM<small>Area staff</small></span>
        </a>
        <nav class="app-nav" data-area="staff" aria-label="Menu staff"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>
  
    <main class="main-content app-main">
      <div class="app-container">
      <h1>Gestione utenze Newsletter - Funzionalità</h1>
  
      <div class="list">
        <a href="/staff/dashboard/management/newsletter/new" class="btn-primary">Invia nuova mail</a>
        <p id="totalUsers"><b>Utenti totali: <span id="totalUsersCount">0</span></b></p>
      </div>
  
      <div class="gallery-search" style="margin-top: 10px;">
        <input type="text" id="searchInput" placeholder="Cerca un iscrizione..." style="
          width: 50%;
          padding: 0.75rem;
          margin: 1rem 0;
          border: 1px solid #ccc;
          border-radius: 8px;
          font-size: 1rem;
        ">
      </div>
  
      <table id="usersTable">
          <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Data iscrizione</th>
                <th>Token di verifica</th>
                <th>Verificato?</th>
                <th>Abilitato a ricezione?</th>
                <th>Azioni</th>
              </tr>
          </thead>
          <tbody id="usersTableBody">
              <!-- JS Loading -->
          </tbody>
      </table>
  
      <p id="messageBox"></p>
      <script>
        const searchInput = document.getElementById("searchInput");
        const tableBody = document.getElementById("usersTableBody");
  
        searchInput.addEventListener("keyup", () => {
          const filter = searchInput.value.toLowerCase();
          const rows = tableBody.querySelectorAll("tr");
  
          rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(filter) ? "" : "none";
          });
        });
      </script>
      </div>
    </main>
    </div>
  </div>
  <link rel="stylesheet" href="/bottomNav.css">
  <script src="/bottomNav.js"></script>
  
</body>
</html>
