<body class="app app--staff">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/staff/dashboard/">
          <img src="https://www.friuliemergenze.it/assets/logo.png" alt="">
          <span>MyFrEM<small>Area staff</small></span>
        </a>
        <nav class="app-nav" data-area="staff" aria-label="Menu staff"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>

  <div class="main-content app-main">
      <div class="app-container">
    <div class="content-box">
      <h1>Carica un documento</h1>
      <form id="uploadForm">
        <label>Nome documento (richiesto)</label>
        <input type="text" id="title" required>

        <label>Descrizione documento (richiesto)</label>
        <textarea id="description" required></textarea>

        <div class="form-group">
          <input type="file" id="inp-upl" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,image/*">
          <label for="inp-upl">Scegli file</label>
          <span id="file-name">Nessun file</span>
        </div>

        <progress id="progressBar" value="0" max="100" style="width:100%;display:none;"></progress>
        <p id="progressText"></p>

        <button id="btn-upl">Carica</button>
      </form>
    </div>
    </div>
    </div>
    </div>

  <link rel="stylesheet" href="/bottomNav.css">
