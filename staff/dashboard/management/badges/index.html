<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Badge | Dashboard Staff - MyFrEM</title>
  <link rel="stylesheet" href="/staff/dashboard/management/badges/style.css">
  <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="module" src="/staff/dashboard/management/badges/load.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script defer type="module" src="/helpers/loadNavbar.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="stylesheet" href="/staff/dashboard/theme.css">
</head>
<body class="app app--staff">
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/staff/dashboard/">
          <img src="https://www.friuliemergenze.it/assets/logo.png" alt="">
          <span>MyFrEM<small>Area staff</small></span>
        </a>
        <nav class="app-nav" data-area="staff" aria-label="Menu staff"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>
  
    <main class="main-content app-main">
      <div class="app-container">
      <h1>Gestione Badge Utenti</h1>
      <p style="color: var(--muted); margin-bottom: 20px;">Visualizza, aggiungi e rimuovi badge associati agli utenti MyFrEM</p>

      <div id="createBrandNewBadge">Crea un nuovo badge</div>

      <div class="badge-management-container">
        <div class="search-section">
          <h2 style="font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-top: 0; margin-bottom: 15px;">Ricerca Utente</h2>
          <input 
            type="text" 
            class="user-search" 
            id="userSearch" 
            placeholder="Cerca per nome, email o username..."
          >
          <div class="users-list" id="usersList">
            <div style="color: var(--muted); text-align: center; padding: 2rem;">Digita per cercare...</div>
          </div>
        </div>

        <div class="badges-section">
          <h2 style="font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-top: 0; margin-bottom: 15px;">Badge Utente</h2>
          
          <div id="badgesContent" style="color: var(--muted); text-align: center; padding: 2rem;">
            Seleziona un utente per gestire i badge
          </div>

          <div id="earnedBadgesContainer" style="display:none;">
            <h3 style="font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-top: 20px; margin-bottom: 15px;">Badge Guadagnati</h3>
            <div class="badges-grid" id="earnedBadgesList"></div>
          </div>

          <div id="availableBadgesContainer" style="display:none;">
            <h3 style="font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-top: 20px; margin-bottom: 15px;">Badge Disponibili</h3>
            <div class="badges-grid" id="availableBadgesList"></div>
          </div>
        </div>
      </div>
      </div>
    </main>
    </div>
  </div>

  <link rel="stylesheet" href="/bottomNav.css">
  
</body>
</html>
