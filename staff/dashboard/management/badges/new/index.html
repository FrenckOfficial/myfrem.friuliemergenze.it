<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Badge Sistema | Staff MyFrEM</title>
  <link rel="stylesheet" href="/staff/dashboard/management/badges/new/style.css">
  <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="module" src="/staff/dashboard/management/badges/new/create.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script defer type="module" src="/helpers/loadNavbar.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="stylesheet" href="/staff/dashboard/theme.css">
</head>
<body class="app app--staff">
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/staff/dashboard/">
          <img src="https://www.friuliemergenze.it/assets/logo.png" alt="">
          <span>MyFrEM<small>Area staff</small></span>
        </a>
        <nav class="app-nav" data-area="staff" aria-label="Menu staff"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>
  
    <main class="main-content app-main">
      <div class="app-container">
      <h1>Nuovo - Gestione Badge Utenti</h1>
      <p style="color: var(--muted); margin-bottom: 20px;">Crea, modifica e gestisci i badge disponibili nel sistema</p>

      <div id="createBrandNewBadge">Torna indietro</div>

      <div class="badge-system-container">
        <div class="create-badge-section">
          <h2 style="font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-top: 0; margin-bottom: 20px;">Nuovo Badge</h2>
          
          <form id="badgeForm">
            <div class="form-group">
              <label for="badgeName">Nome Badge *</label>
              <input type="text" id="badgeName" placeholder="Es. Primo Scatto" required>
            </div>

            <div class="form-group">
              <label for="badgeDescription">Descrizione *</label>
              <textarea id="badgeDescription" placeholder="Descrivi il badge..." rows="3" required></textarea>
            </div>

            <div class="form-group">
              <label for="badgeColor">Colore Hex *</label>
              <div class="color-input-wrapper">
                <input type="color" id="badgeColor" value="#ff7b00">
                <input type="text" id="badgeColorHex" placeholder="#ff7b00" value="#ff7b00">
              </div>
            </div>

            <div class="form-group">
              <label for="criteriaType">Tipo Criterio *</label>
              <select id="criteriaType" required>
                <option value="">-- Seleziona --</option>
                <option value="photos">Foto Caricate</option>
                <option value="surveys">Survey Completati</option>
                <option value="exploration">Esplorazione Servizi</option>
                <option value="time">Tempo Membro</option>
                <option value="votes-received">Voti Ricevuti</option>
                <option value="votes-given">Voti Dati</option>
                <option value="interactions">Interazioni Totali</option>
                <option value="manual">Manuale (Staff Only)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="criteriaThreshold">Soglia *</label>
              <input type="number" id="criteriaThreshold" placeholder="Es. 5" min="1" required>
              <small id="thresholdHint" style="color: var(--muted); display: block; margin-top: 5px;"></small>
            </div>

            <div class="form-group form-checkbox">
              <input type="checkbox" id="badgeEnabled" checked>
              <label for="badgeEnabled">Attivo</label>
            </div>

            <button type="submit" class="btn-create">Crea Badge</button>
          </form>
        </div>

        <div class="badges-list-section">
          <h2 style="font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-top: 0; margin-bottom: 20px;">Badge Esistenti</h2>
          
          <div class="badges-list" id="badgesList">
            <div style="color: var(--muted); text-align: center; padding: 2rem;">Caricamento badge...</div>
          </div>
        </div>
      </div>
      </div>
    </main>
    </div>
  </div>

  <link rel="stylesheet" href="/bottomNav.css">
  
</body>
</html>
