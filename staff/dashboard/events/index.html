    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Eventi - Dashboard Staff | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
    <link rel="stylesheet" href="/staff/dashboard/events/events-staff.css">
    <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" src="/staff/dashboard/events/load.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <button class="menu-toggle" aria-label="Toggle navigation menu">
      <i class="fas fa-bars"></i>
    </button>
    <aside class="sidebar">
      <div class="logo">
        <img src="https://www.friuliemergenze.it/assets/logo.png" alt="MyFrEM Logo" loading="lazy">
        <h2>MyFrEM Staff</h2>
      </div>
      <nav>
        <a href="/staff/dashboard/">Dashboard</a>
        <a href="/staff/dashboard/photos/">Moderazione foto</a>
        <a href="/staff/dashboard/users/">Funzionalità</a>
        <a href="/staff/dashboard/events/" class="active">Moderazione eventi</a>
        <a href="/staff/dashboard/kick-reports/">Rapporti di espulsione</a>
        <a href="/staff/dashboard/settings/">Impostazioni</a>
        <br>
        <a href="/dashboard/">Passa a dashboard utente</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>
  
    <main class="main-content">
      <div class="page-header">
        <h2>Gestione Eventi</h2>
        <p>Qui puoi vedere tutte le richieste di eventi e gestirne lo stato.</p>
      </div>
  
      <p class="statusBox" style="display:none;">
        <span id="statusMsg"></span>
        <button id="closeSMsg">&times;</button>
      </p>
  
      <div class="events-container" id="eventsList" style="max-width: 780px;">
        <!-- Eventi caricati dinamicamente con JS -->
      </div>
    </main>
  </div>
  <script>
    (function() {
      const menuToggle = document.querySelector('.menu-toggle');
      const sidebar = document.querySelector('.sidebar');
      const body = document.body;

      if (!menuToggle || !sidebar) {
        console.warn('Menu toggle or sidebar not found');
        return;
      }
      
      function toggleSidebar() {
        sidebar.classList.toggle('active');
        body.classList.toggle('sidebar-open');
      }

      function closeSidebar() {
        sidebar.classList.remove('active');
        body.classList.remove('sidebar-open');
      }
      function openSidebar() {
        sidebar.classList.add('active');
        body.classList.add('sidebar-open');
      }

      menuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSidebar();
      });

      const navLinks = sidebar.querySelectorAll('nav a');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          closeSidebar();
        });
      });

      document.addEventListener('click', (e) => {
        if (sidebar.classList.contains('active')) {
          if (e.target === menuToggle || menuToggle.contains(e.target)) {
            return;
          }
          if (!sidebar.contains(e.target)) {
            closeSidebar();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('active')) {
          closeSidebar();
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (window.innerWidth > 768) {
            closeSidebar();
          }
        }, 250);
      });
    })();
  </script>
</body>
</html>
