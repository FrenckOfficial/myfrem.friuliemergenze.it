<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizza - Rapporti di espulsione | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/staff/dashboard/kick-reports/view/view.css">
  <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script type="module" src="/staff/dashboard/kick-reports/view/view.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="https://www.friuliemergenze.it/assets/logo.png" alt="MyFrEM Logo" loading="lazy">
      <h2>MyFrEM Staff</h2>
    </div>
    <nav>
      <a href="/staff/dashboard/">Dashboard</a>
      <a href="/staff/dashboard/photos/">Moderazione foto</a>
      <a href="/staff/dashboard/users/">Funzionalità</a>
      <a href="/staff/dashboard/kick-reports/" class="active">Rapporti di espulsione</a>
      <a href="/staff/dashboard/settings/">Impostazioni</a>
        <br>
        <a href="/dashboard/">Passa a dashboard utente</a>
    </nav>
    <button id="logoutBtn" class="logout">Logout</button>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h2>Dettagli Kick Report</h2>
      <p>Visualizza tutte le informazioni relative al report selezionato.</p>
      <a href="/staff/dashboard/kick-reports/" class="btn-primary">⬅Torna alla lista</a>
    </div>

    <div class="activity-box" id="reportDetails">
      <!-- Dettagli caricati dinamicamente via JS -->
      <p>Caricamento report...</p>
    </div>
  </main>
  <script>
    (function() {
      const menuToggle = document.querySelector('.menu-toggle');
      const sidebar = document.querySelector('.sidebar');
      const body = document.body;

      if (!menuToggle || !sidebar) {
        console.warn('Menu toggle or sidebar not found');
        return;
      }
      
      function toggleSidebar() {
        sidebar.classList.toggle('active');
        body.classList.toggle('sidebar-open');
      }

      function closeSidebar() {
        sidebar.classList.remove('active');
        body.classList.remove('sidebar-open');
      }
      function openSidebar() {
        sidebar.classList.add('active');
        body.classList.add('sidebar-open');
      }

      menuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSidebar();
      });

      const navLinks = sidebar.querySelectorAll('nav a');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          closeSidebar();
        });
      });

      document.addEventListener('click', (e) => {
        if (sidebar.classList.contains('active')) {
          if (e.target === menuToggle || menuToggle.contains(e.target)) {
            return;
          }
          if (!sidebar.contains(e.target)) {
            closeSidebar();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('active')) {
          closeSidebar();
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (window.innerWidth > 768) {
            closeSidebar();
          }
        }, 250);
      });
    })();
  </script>
</body>
</html>
