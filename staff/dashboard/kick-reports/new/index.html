<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuovo - Report di Espulsione | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/staff/dashboard/staff.css">
  <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="/staff/dashboard/kick-reports/new/report.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="https://www.friuliemergenze.it/assets/logo.png" alt="Logo MyFrEM" loading="lazy">
      <h2>MyFrEM Staff</h2>
    </div>
    <nav>
      <a href="/staff/dashboard/">Dashboard</a>
      <a href="/staff/dashboard/photos/">Moderazione foto</a>
      <a href="/staff/dashboard/users/">Funzionalità</a>
      <a href="/staff/dashboard/events/">Moderazione eventi</a>
      <a href="/staff/dashboard/kick-reports/" class="active">Rapporti di espulsione</a>
      <a href="/staff/dashboard/settings/">Impostazioni</a>
        <br>
        <a href="/dashboard/">Passa a dashboard utente</a>
    </nav>
    <button id="logoutBtn" class="logout">Logout</button>
  </aside>
  <main class="main-content">
    <div class="top-bar">
        <h1>Report di Espulsione</h1>
    </div>

    <p>Compila il modulo qui sotto per segnalare l'espulsione di un membro.</p>
    <p class="statusBox" style="display:none;">
      <span id="statusMsg"></span>
      <button id="closeSMsg">&times;</button>
    </p>

    <div class="activity-box">
        <form id="expulsionReportForm">
            <div class="form-row">
              <div class="form-col">
                <label for="userSelect">Nome utente espulso:</label>
                <textarea id="userSelect" class="photo-link-input"></textarea>
              </div>

              <div class="form-col">
                <label for="userNumber">Numero contatto utente espulso:</label>
                <input type="tel" id="userNumber" class="photo-link-input">
              </div>
            </div>
            <div class="form-group">
                <label for="reason">Motivo dell'espulsione:</label>
                <textarea id="reason" class="photo-link-input" placeholder="Inserisci il motivo..." required></textarea>
            </div>
            <div class="form-group">
                <label for="expulsionDate">Data espulsione:</label>
                <input type="date" id="expulsionDate" class="photo-link-input" required>
            </div>
            <div class="form-group">
                <label for="notes">Note aggiuntive (facoltativo):</label>
                <textarea id="notes" class="photo-link-input" placeholder="Eventuali note aggiuntive..."></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="quick-btn">Invia Report</button>
                <a href="/staff/dashboard/kick-reports/" class="quick-btn" style="margin-top: 20px; width: 11.7%;">🔙 Torna alla pagina precedente</a>
            </div>
        </form>
    </div>
  </main>
  <script>
    (function() {
      const menuToggle = document.querySelector('.menu-toggle');
      const sidebar = document.querySelector('.sidebar');
      const body = document.body;

      if (!menuToggle || !sidebar) {
        console.warn('Menu toggle or sidebar not found');
        return;
      }
      
      function toggleSidebar() {
        sidebar.classList.toggle('active');
        body.classList.toggle('sidebar-open');
      }

      function closeSidebar() {
        sidebar.classList.remove('active');
        body.classList.remove('sidebar-open');
      }
      function openSidebar() {
        sidebar.classList.add('active');
        body.classList.add('sidebar-open');
      }

      menuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSidebar();
      });

      const navLinks = sidebar.querySelectorAll('nav a');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          closeSidebar();
        });
      });

      document.addEventListener('click', (e) => {
        if (sidebar.classList.contains('active')) {
          if (e.target === menuToggle || menuToggle.contains(e.target)) {
            return;
          }
          if (!sidebar.contains(e.target)) {
            closeSidebar();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('active')) {
          closeSidebar();
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (window.innerWidth > 768) {
            closeSidebar();
          }
        }, 250);
      });
    })();
  </script>
</body>
</html>
