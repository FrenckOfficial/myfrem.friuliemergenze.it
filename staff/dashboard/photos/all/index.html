<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-Z4DJJRR7BY');

  <meta charset="UTF-8">
  <title>Tutte le Foto | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/staff/dashboard/staff.css">
  <script type="module" src="/staff/dashboard/photos/all/all-photos.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script defer type="module" src="/helpers/loadNavbar.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="stylesheet" href="/staff/dashboard/theme.css">
</head>
<body class="app app--staff">
  <div class="loading">
    <div class="loader"></div>
    <p>Caricamento in corso...</p>
  </div>
  <div class="content" style="display:none;">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/staff/dashboard/">
          <img src="https://www.friuliemergenze.it/assets/logo.png" alt="">
          <span>MyFrEM<small>Area staff</small></span>
        </a>
        <nav class="app-nav" data-area="staff" aria-label="Menu staff"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>
  
    <div class="main-content app-main">
      <div class="app-container">
      <h1>Tutte le foto caricate</h1>
      <a id="backPhotoModeration" onclick="window.history.back()">Torna alla moderazione delle foto</a>
      <section class="panel activity-panel" id="photosPanel">
      <div class="table-scroll" id="photosFrame">
      <table class="photos-table">
        <thead>
          <tr>
            <th>Stato</th>
            <th>Anteprima</th>
            <th>Modello</th>
            <th>Allestitore</th>
            <th>Numero di targa</th>
            <th>Servizio svolto</th>
            <th>Sede di appartenenza</th>
            <th>Utente</th>
            <th>Data</th>
            <th>Note</th>
            <th>Voti</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody id="photosTbody">
        </tbody>
      </table>
      </div>
      </section>
      </div>
    </div>
    </div>

    <div class="first-access-modal" id="votesModal">
      <div class="modal-overlay"></div>
      <div class="modal-container votes-modal-content">

        <span class="close" id="closeVotesModal">&times;</span>

        <div class="modal-header">
          <h2 id="votesModalTitle"></h2>
          <p id="votesCount"></p>
        </div>

        <div class="modal-content">
          <table class="votes-table">
            <thead id="votesTableHead">
              <tr>
                <th>Utente</th>
                <th>Tipologia</th>
                <th>Votato in data</th>
              </tr>
            </thead>
            <tbody id="votesTableBody">
              <!-- JS Loading -->
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
  <div id="lightboxOverlay" class="lightbox-overlay">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <div class="lightbox-content">
      <img id="lightboxImg" class="lightbox-image" src="" alt="">
      <div class="lightbox-info" id="lightboxInfo"></div>
    </div>
  </div>
  <link rel="stylesheet" href="/bottomNav.css">
  <script>
    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxInfo = document.getElementById('lightboxInfo');
  
    /**
     * @param {HTMLElement} imgElement - Elemento img da visualizzare
     * @param {string} title - Titolo opzionale da mostrare sotto
     */
    function openLightbox(imgElement, title = '') {
      lightboxImg.src = imgElement.src;
      lightboxImg.alt = imgElement.alt || 'Foto';
      lightboxInfo.textContent = title || imgElement.alt || '';
      lightboxOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightboxOverlay.classList.remove('active');
      document.body.style.overflow = 'auto';
    }
  
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightboxOverlay.classList.contains('active')) {
        closeLightbox();
      }
    });
  
    lightboxOverlay.addEventListener('click', (e) => {
      if (e.target === lightboxOverlay) {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
