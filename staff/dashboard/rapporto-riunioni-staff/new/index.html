<html lang="it">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>Nuovo Report - Riunioni Staff - MyFrEM - La migliore in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
    <link rel="stylesheet" href="/staff/dashboard/staff.css">
    <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="module" src="./save.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script defer type="module" src="/helpers/loadNavbar.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="stylesheet" href="/staff/dashboard/theme.css">
</head>
<body class="app app--staff">
    <div class="loading">
        <div class="loader"></div>
        <p>Caricamento in corso...</p>
    </div>
    <div class="content" style="display:none;">
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/staff/dashboard/">
          <img src="https://www.friuliemergenze.it/assets/logo.png" alt="">
          <span>MyFrEM<small>Area staff</small></span>
        </a>
        <nav class="app-nav" data-area="staff" aria-label="Menu staff"></nav>
        <div class="app-sidebar-footer">
          <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
        </div>
      </aside>
        <div class="main-content app-main">
      <div class="app-container">
            <div class="top-bar">
                <h1>Report Riunione Staff</h1>
            </div>
            <p>Compila qui sotto per registrare l'esito di una riunione dello staff</p>
            <div class="activity-box">
                <form id="reunionReportForm">
                    <div class="form-row">
                        <div class="form-col">
                            <label for="startDate">Data e ora inizio:</label>
                            <input type="datetime-local" id="startDate" class="photo-link-input" required>
                        </div>
                        <div class="form-col">
                            <label for="finishDate">Data e ora fine:</label>
                            <input type="datetime-local" id="endDate" class="photo-link-input" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-col">
                            <label for="ordine">Ordine del giorno:</label>
                            <input type="text" id="ordine" class="photo-link-input" required>
                        </div>
                        <div class="form-col">
                            <h4>Staffer di apertura e chiusura</h4>
                            <span id="opener" class="photo-link-input opener-input"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="description">Esito finale della riunione</label>
                        <textarea id="description" class="photo-link-input" required></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="quick-btn send-report">Invia e carica Report</button>
                    </div>
                </form>
                <div id="statusMsg"></div>
            </div>
          </div>
    </div>
    </div>
    </div>
    
    <link rel="stylesheet" href="/bottomNav.css">
    <script src="/bottomNav.js"></script>
  
</body>
</html>
