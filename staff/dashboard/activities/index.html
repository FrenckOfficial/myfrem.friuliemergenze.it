<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DJJRR7BY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DJJRR7BY');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutte le attività - Dashboard Staff | MyFrEM - La migliore piattaforma in Friuli-Venezia Giulia nel caricamento foto inerenti l'emergenza</title>
  <link rel="stylesheet" href="/staff/dashboard/staff.css">
  <link rel="shortcut icon" href="https://www.friuliemergenze.it/assets/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="module" src="/staff/dashboard/activities/load.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script defer type="module" src="/helpers/loadNavbar.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="stylesheet" href="/staff/dashboard/theme.css">
</head>
<body class="app app--staff">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="app-brand" href="/staff/dashboard/">
        <img src="https://www.friuliemergenze.it/assets/logo.png" alt="">
        <span>MyFrEM<small>Area staff</small></span>
      </a>
      <nav class="app-nav" data-area="staff" aria-label="Menu staff"></nav>
      <div class="app-sidebar-footer">
        <button id="logoutBtn" class="btn btn--ghost btn--block" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Esci</button>
      </div>
    </aside>

    <div class="main-content app-main">
      <div class="app-container">
      <h1>Tutte le attività</h1>
      <section class="panel activity-panel">
        <div class="toolbar activity-toolbar">
          <div class="tabs activity-tabs" id="activityTabs" role="tablist" aria-label="Categoria"></div>
        </div>
        <div class="activity-filters">
          <div class="field">
            <label for="filterFrom">Dal</label>
            <input class="input" type="date" id="filterFrom">
          </div>
          <div class="field">
            <label for="filterTo">Al</label>
            <input class="input" type="date" id="filterTo">
          </div>
          <div class="field">
            <label for="filterSize">Per pagina</label>
            <select class="input" id="filterSize">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <button class="btn btn--ghost activity-reset" type="button" id="filterReset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i>Azzera filtri</button>
        </div>
        <ul class="activity activity-list" id="activitiesList"></ul>
        <div class="activity-pager">
          <button class="btn btn--ghost btn--sm" type="button" id="pagePrev" disabled><i class="fa-solid fa-chevron-left" aria-hidden="true"></i>Precedente</button>
          <span class="hint" id="pageInfo" aria-live="polite"></span>
          <button class="btn btn--ghost btn--sm" type="button" id="pageNext" disabled>Successiva<i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </div>
      </section>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="/bottomNav.css">
</body>
</html>
